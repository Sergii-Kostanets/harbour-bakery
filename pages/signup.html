<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Harbour Bakery</title>
</head>
<body>
    <header>
        <h1>Harbour Bakery</h1>
        <nav>
            <a href="../index.html">Home</a>
            <a href="../about.html">About us</a>
            <a href="menu.html">Menu</a>
            <a href="visit.html">Visit us</a>
            <a href="signup.html">Sign up</a>
        </nav>
    </header>
    <main>
        <h2>Join our bakery club</h2>
        <p>Sign up for bakery news, special offers and a little something on your birthday.</p>
        <!-- Method on production should be changed to post -->
        <form action="signup.html" method="get">
            <p>
                <label for="full-name">Full name *</label>
                <input type="text" id="full-name" name="full-name" required>
            </p>
            <p>
                <label for="email">Email address *</label>
                <input type="email" id="email" name="email" placeholder="name@example.com" required>
            </p>
            <p>
                <label for="phone">Phone number</label>
                <input type="tel" id="phone" name="phone" autocomplete="tel">
            </p>
            <p>
                <label for="password">Choose a password for your bakery-club account</label>
                <input type="password" id="password" name="password" autocomplete="new-password">
            </p>
            <p>
                <label for="visits">How many times have you visited us this year?</label>
                <input type="number" id="visits" name="visits" min="0">
            </p>
            <p>
                <label for="birthday">Your birthday (optional)</label>
                <input type="date" id="birthday" name="birthday">
            </p>
            <fieldset>
                <legend>How would you like us to contact you?</legend>
                <input type="radio" id="contact-email" name="contact-method" value="email" checked>
                <label for="contact-email">Email</label>
                <input type="radio" id="contact-phone" name="contact-method" value="phone">
                <label for="contact-phone">Phone</label>
            </fieldset>
            <fieldset>
                <legend>Which bakery treats do you enjoy?</legend>
                <input type="checkbox" id="bread" name="favourites" value="bread">
                <label for="bread">Bread</label>
                <input type="checkbox" id="scones" name="favourites" value="scones">
                <label for="scones">Scones</label>
                <input type="checkbox" id="cakes" name="favourites" value="cakes">
                <label for="cakes">Cakes</label>
            </fieldset>
            <p>
                <label for="visit-day">Which day do you usually visit?</label>
                <select id="visit-day" name="visit-day">
                    <option value="monday">Monday</option>
                    <option value="wednesday">Wednesday</option>
                    <option value="saturday">Saturday</option>
                </select>
            </p>
            <p>
                <label for="baking-suggestion">A treat you would like us to bake</label>
                <textarea id="baking-suggestion" name="baking-suggestion" rows="4" cols="40"></textarea>
            </p>
            <p>
                <button type="submit">Join the bakery club</button>
                <button type="reset">Start again</button>
            </p>
        </form>
    </main>
</body>
</html>
